services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Set your backend API URL here
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    restart: unless-stopped
    networks:
      - dyad-network

networks:
  dyad-network:
    driver: bridge
